<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="src/style.css"/>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <title>Meteo App</title>
</head>
<body>
    <div class="weather-app">
        <header>
            <form class="search-form" id="search-form">
                <input
                type="search"
                placeholder="Enter a city" 
                required 
                id="search-form-input"
                class="search-form-input"
                />
                <input type="submit" value="Search" class="search-form-button" />
            </form>
        </header>
    <main>
    <div class="weather-app-data">
    <div>
        <h1 class="weather-app-city" id="weather-app-city"></h1>
        <p class="weather-app-details">
  <span id="time"></span>, 
  <span id="description"></span>
  <br />
  Humidity: <strong id="humidity"></strong>, Wind:
  <strong id="wind-speed"></strong>
</p>
      </div>
<div class="weather-app-temperature-container">
  <div id="icon"></div>
  <div class="weather-app-temperature" id="temperature"></div>
  <div class="weather-app-unit">°C</div>
</div>
</div>
        <div class="weather-forecast" id="forecast">
          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Sun</div>
            <img src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/rain-day.png" alt="rain" class="weather-forecast-icon" />
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature"><strong>15º</strong></div>
              <div class="weather-forecast-temperature">8º</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Mon</div>
            <img src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/rain-day.png" alt="rain" class="weather-forecast-icon" />
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature"><strong>15º</strong></div>
              <div class="weather-forecast-temperature">9º</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Tue</div>
            <img src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/rain-day.png" alt="rain" class="weather-forecast-icon" />
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature"><strong>18º</strong></div>
              <div class="weather-forecast-temperature">11º</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Wed</div>
            <img src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/clear-sky-day.png" alt="clear sky" class="weather-forecast-icon" />
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature"><strong>15º</strong></div>
              <div class="weather-forecast-temperature">8º</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Thu</div>
            <img src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/few-clouds-day.png" alt="few clouds" class="weather-forecast-icon" />
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature"><strong>15º</strong></div>
              <div class="weather-forecast-temperature">7º</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Fri</div>
            <img src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/few-clouds-day.png" alt="few clouds" class="weather-forecast-icon" />
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature"><strong>15º</strong></div>
              <div class="weather-forecast-temperature">7º</div>
            </div>
          </div>
        </div>
      </main>
        <footer>
            This project was coded by
    <a href="https://github.com/cfonport" target="_blank"> Cláudia</a>,
      is open-sourced on
    <a href="https://github.com/cfonport/SheCodes-Plus-Week-8-Vanilla-Weather-Forecast" target="_blank">GitHub</a>
      and hosted on
    <a href="https://shecodes-plus-week-8-vanilla-weather.netlify.app" target="_blank"
        >Netlify</a>
</footer>
    </div>
    <script src="src/index.js"></script>
</body>
